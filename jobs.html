    <body>
        <ul>
            <div class="logo"><li><a href="index.html">Home [insert logo]</a></li></div>
            <li><a href="about.html">About Us</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="jobs.html">Jobs</a></li>

        <div id="page-container">
            <h1>Join our Team</h1>
            <h2>Call us here: 123-456-7890</h2>
            <h3>Interest form:</h3>
            <p>We are always looking for new additions to our team. If you are interested in working with us, please fill out the form below.</p>
            <form id="form">
                <label for="fname">First name:</label>
                <input type="text" id="fname" name="fname" required><br>

                <label for="lname">Last name:</label>
                <input type="text" id="lname" name="lname" required><br>

                <label for="email">Email address:</label>
                <input type="text" id="email" name="email" required><br>

                <label for="phonenum">Phone number:</label>
                <input type="text" id="phonenum" name="phonenum" required><br>

                <label for="exp">Experience:</label><br>
                <textarea class="big-txtbox"  id="exp" name="exp" required></textarea><br>
                
                <label for="addtl">Additional comments:</label><br>
                <textarea class="big-txtbox" id="addtl" name="addtl"></textarea><br>
                
                <button type="submit">Submit</button>
            </form>
        </div>
        <script src="js/form.js"></script>
    </body>
